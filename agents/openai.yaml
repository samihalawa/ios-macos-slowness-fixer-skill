interface:
  display_name: "iOS / macOS Slowness & Storage Fixer"
  short_description: "Diagnose and fix iPhone, iPad, or Mac slowness, freezes, crashes, heat, and storage bloat, running Trash-first 80/20 cleanups safely"
  default_prompt: "Use $ios-macos-slowness-fixer-skill. First detect where you are running (local macOS, sandbox, or cloud) and which tools can reach the host (Bash, Desktop Commander MCP, computer-use, libimobiledevice, pymobiledevice3, devicectl), then list connected devices. For iPhone/iPad read battery ioreg, storage, crash and Jetsam reports, hang tracer analytics, a clean live syslog, and a sysdiagnose power log (button-combo route when Developer Mode is off); for a Mac read swap, compressor, load, process families, orphaned swap hogs, leftover agent/MCP browsers, Jetsam, panics, launchd agents, and sleep assertions. For Mac storage bloat, map every 10+ GB/100 GB block cleanly (checking mount/du -shx against virtual mounts and skipping iCloud dataless stubs), combine mdfind with dotdir/App Support walks without truncating outputs, and execute Trash-first 80/20 cleanups (CloudKit/DriveFS caches, build artifacts/simulators/node_modules with lockfiles, .bak*/.tmp*/Chromium atomic temp files/logs, and SHA-256 verified duplicates) while strictly preserving AI session histories, memories, and personal media."
