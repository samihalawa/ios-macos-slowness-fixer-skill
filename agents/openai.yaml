interface:
  display_name: "iOS / macOS Slowness Fixer"
  short_description: "Find why an iPhone, iPad, or Mac is slow, freezing, crashing, or hot, using the device's own logs, then fix it and give the owner a localized plan"
  default_prompt: "Use $ios-macos-slowness-fixer-skill. First detect where you are running (local macOS, sandbox, or cloud) and which tools can reach the host (Bash, Desktop Commander MCP, computer-use, libimobiledevice, pymobiledevice3, devicectl), then list connected devices. For iPhone/iPad read battery ioreg, storage, crash and Jetsam reports, hang tracer analytics, a clean live syslog, and a sysdiagnose power log (button-combo route when Developer Mode is off); for a Mac read swap, compressor, load, process families, leftover agent/MCP browsers, Jetsam, panics, and sleep assertions. Verify every cause before blaming it, apply safe agent fixes with confirmation for others' processes, and write a short owner-facing plan in the owner's language with menu paths in the device's UI language, reassuring that notifications keep working."
